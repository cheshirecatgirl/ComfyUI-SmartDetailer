name: Compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.target }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: minimum, os: ubuntu-latest}
          - {target: latest, os: ubuntu-latest}
          - {target: upstream, os: ubuntu-latest}
          - {target: minimum, os: windows-latest}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve ComfyUI revision
        id: comfy
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          COMFY_TARGET: ${{ matrix.target }}
        with:
          script: |
            let ref = 'v0.34.0';
            if (process.env.COMFY_TARGET === 'latest') {
              const {data} = await github.rest.repos.getLatestRelease({owner:'Comfy-Org', repo:'ComfyUI'});
              ref = data.tag_name;
            } else if (process.env.COMFY_TARGET === 'upstream') {
              const {data} = await github.rest.repos.get({owner:'Comfy-Org', repo:'ComfyUI'});
              ref = data.default_branch;
            }
            core.setOutput('ref', ref);
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ steps.comfy.outputs.ref }}
          path: .comfy-test
          persist-credentials: false
      - name: Install CPU runtime
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .comfy-test/requirements.txt
      - name: Record runtime
        run: |
          git -C .comfy-test log -1 --format="%H %s"
          python -m pip freeze
      - name: Core and integration tests
        env:
          COMFYUI_PATH: ${{ github.workspace }}/.comfy-test
        run: |
          python tests/run_tests.py
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Live HTTP workflow
        if: runner.os == 'Linux'
        env:
          COMFYUI_PATH: ${{ github.workspace }}/.comfy-test
        run: python tests/http_smoke.py
